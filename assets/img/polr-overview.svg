<rect x="20" y="20" width="322" height="228" rx="16" class="box"/>
<text x="32" y="44.0" font-size="13" text-anchor="start"><tspan class="b">Q:</tspan> A robe takes 2 bolts of blue fiber and</text>
<text x="32" y="62.4" font-size="13" text-anchor="start">half that much white fiber. How many bolts</text>
<text x="32" y="80.8" font-size="13" text-anchor="start">in total does it take?</text>
<text x="32" y="99.2" font-size="13" text-anchor="start"><tspan class="b">A:</tspan> It takes 2/2=&lt;&lt;2/2=1&gt;&gt;1 bolt of white</text>
<text x="32" y="117.6" font-size="13" text-anchor="start">fiber So the total amount of fabric is</text>
<text x="32" y="136.0" font-size="13" text-anchor="start">2+1=&lt;&lt;2+1=3&gt;&gt;3 bolts of fabric</text>
<text x="32" y="154.4" font-size="13" text-anchor="start">....</text>
<text x="32" y="172.8" font-size="13" text-anchor="start"><tspan class="b">Q:</tspan> James decides to run 3 sprints 3 times</text>
<text x="32" y="191.2" font-size="13" text-anchor="start">a week. He runs 60 meters each sprint.</text>
<text x="32" y="209.6" font-size="13" text-anchor="start">How many total meters does he run a week?</text>
<text x="32" y="228.0" font-size="13" text-anchor="start"><tspan class="b">A:</tspan></text>
