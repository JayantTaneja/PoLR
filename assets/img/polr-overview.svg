<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 618" width="980" height="618" role="img" aria-label="Self-Consistency expands all N sampled reasoning traces before a majority vote; PoLR generates N short prefixes, embeds and clusters them, and expands only the K traces of the dominant cluster before voting.">
